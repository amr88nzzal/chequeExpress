# Serves the apps/web single-page application inside the stack.
# The gateway proxies "/" here; this container is never published on the host.
server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets are immutable; the HTML must never be cached or a deploy
  # would keep serving the previous bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Client-side routing (BrowserRouter): unknown paths are the app's, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
