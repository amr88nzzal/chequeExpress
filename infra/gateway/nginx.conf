# TLS is terminated by the Cloudflare Tunnel (cloudflared) in front of this gateway,
# so the gateway speaks plain HTTP on the private network only.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;

  # Never expose liveness/readiness details beyond what the deploy script and tunnel need.
  location /health/ {
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params.conf;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    include /etc/nginx/proxy_params.conf;
  }

  # Web app (apps/web) is added in C1; until then the gateway answers 404 for everything else.
  location / {
    default_type application/json;
    return 404 '{"ok":false,"error":{"code":"NOT_FOUND","message":"Route not found"},"requestId":"$request_id"}';
  }
}
