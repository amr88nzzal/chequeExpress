# Cheques stack. Run from this directory:  docker compose --env-file .env up -d
# Images are pinned by tag; override IMAGE_TAG per deployment.
name: cheques

services:
  postgres:
    image: postgres:17-bookworm # multi-arch (arm64 + amd64)
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cheques}
      POSTGRES_USER: ${POSTGRES_OWNER_USER} # owner/migrations role; the app role is created in C0-3
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  api:
    image: cheques-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '${PORT:-3650}'
      API_TOKEN: '${API_TOKEN:?API_TOKEN is not set in infra/.env}'
      DATABASE_URL: 'postgres://${APP_DB_USER:-cheques_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is not set in infra/.env}@postgres:5432/${POSTGRES_DB:-cheques}'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # worker (pg-boss) joins when the first queue exists (C1); render (Chromium) joins in C0-4.

  # The UI. Static after the build; not published on the host, only the gateway.
  web:
    image: cheques-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine # multi-arch
    restart: unless-stopped
    environment:
      API_PORT: '${PORT:-3650}'
      NGINX_ENVSUBST_FILTER: '^API_'
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./gateway/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3650}:8080' # loopback by default; cloudflared reaches it locally
    depends_on:
      - api
      - web
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
